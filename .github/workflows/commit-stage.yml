
name: Commit Stage

on:
  push:
  pull_request:

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Build, unit tests and integration tests
        env:
          JAVA_TOOL_OPTIONS: "-Dapi.version=1.44"
        run: |
          chmod +x gradlew
          ./gradlew build
